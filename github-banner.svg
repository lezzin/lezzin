<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Leandro Adrian, Backend Developer, especialista em NestJS e Laravel</title>
<desc id="d">Leandro Adrian (lezzin), desenvolvedor backend em Muzambinho, MG, Brasil, focado em sistemas robustos, escaláveis e orientados a eventos. Diagrama: Laravel e NestJS publicam mensagens no RabbitMQ, que alimenta Redis, PostgreSQL e MySQL, dentro de containers Docker e Kubernetes.</desc>
